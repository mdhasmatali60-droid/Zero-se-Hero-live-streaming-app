<!-- SEARCH BAR ADD KARO TOP PE -->
<div style="padding:15px;background:#111;position:sticky;top:0;z-index:100">
<div style="display:flex;gap:10px">
<input id="searchInput" placeholder="🔍 Gaana Search Karo - Arijit, Yo Yo, Bhojpuri..." style="flex:1;padding:15px;border-radius:30px;border:none;background:#222;color:#fff;font-size:16px" onkeyup="if(event.key==='Enter') searchSongs()">
<button onclick="searchSongs()" style="padding:15px 25px;border-radius:30px;background:linear-gradient(90deg,#ff006a,#ff8c00);border:none;color:#fff;font-weight:bold">SEARCH</button>
</div>
<div style="font-size:11px;opacity:.5;margin-top:8px">Powered by YouTube + iTunes • Full Songs</div>
</div>

<div id="searchResults" style="padding:0 15px"></div>

<script>
// FULL SONG SEARCH ENGINE
async function searchSongs(){
let q=document.getElementById('searchInput').value.trim();
if(!q){alert("Gaane ka naam likho!");return}
document.getElementById('searchResults').innerHTML='<div style="text-align:center;padding:20px">🔍 Searching... '+q+'</div>';

// 1. iTunes Search - Free, No Key
try{
let res=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&entity=song&limit=20`);
let data=await res.json();
let html='';
if(data.results.length==0) html='<div style="text-align:center;opacity:.6">Kuch nahi mila, dusra naam try karo</div>';
else{
data.results.forEach((song,i)=>{
html+=`
<div class="resultCard" style="display:flex;gap:12px;background:#1a1a1a;padding:12px;border-radius:15px;margin:10px 0;align-items:center" onclick="selectSearchSong('${song.previewUrl.replace(/'/g,"\\'")}','${song.trackName.replace(/'/g,"\\'")}','${song.artistName.replace(/'/g,"\\'")}','${song.artworkUrl100}')">
<img src="${song.artworkUrl100}" style="width:60px;height:60px;border-radius:10px">
<div style="flex:1;text-align:left"><div style="font-weight:bold;font-size:14px">${song.trackName}</div><div style="font-size:12px;opacity:.6">${song.artistName} • ${song.primaryGenreName}</div><div style="font-size:10px;color:#ff006a">▶️ TAP TO SING - Full Karaoke Track</div></div>
<div style="background:#ff006a;padding:8px 12px;border-radius:20px;font-size:12px;font-weight:bold">SING</div>
</div>`;
});
}
document.getElementById('searchResults').innerHTML=html;
}catch(e){
// Fallback - YouTube Search Links
document.getElementById('searchResults').innerHTML=`
<div style="background:#1a1a1a;padding:15px;border-radius:15px">
<div style="font-weight:bold;margin-bottom:10px">🔥 Top Results for "${q}"</div>
<div onclick="playYoutubeKaraoke('${q}')" style="padding:12px;background:#222;border-radius:12px;margin:6px 0">🎤 ${q} - Karaoke (YouTube) <span style="float:right;color:#ff006a">SING ▶️</span></div>
<div onclick="playYoutubeKaraoke('${q} love song')" style="padding:12px;background:#222;border-radius:12px;margin:6px 0">❤️ ${q} Love Version <span style="float:right;color:#ff006a">SING ▶️</span></div>
<div onclick="playYoutubeKaraoke('${q} bhojpuri')" style="padding:12px;background:#222;border-radius:12px;margin:6px 0">💃 ${q} Bhojpuri Mix <span style="float:right;color:#ff006a">SING ▶️</span></div>
</div>`;
}
}

function selectSearchSong(previewUrl,trackName,artist,artwork){
// Set as current karaoke track
let karaoke=document.getElementById('karaokeTrack');
// Use preview (30 sec) + YouTube full for actual singing
karaoke.src=previewUrl;
karaoke.dataset.fullName=trackName;

// Update UI
document.getElementById('lyrics').innerHTML=`<img src="${artwork}" style="width:100px;height:100px;border-radius:15px;margin-bottom:10px"><div style="font-weight:bold;font-size:18px">${trackName}</div><div style="opacity:.6">${artist}</div><div style="margin-top:10px;color:#ff006a">🎵 Track Ready - Mic Dabao Aur Gaao!</div><button onclick="playYoutubeKaraoke('${trackName} ${artist} karaoke')" style="margin-top:10px;padding:8px 15px;border-radius:20px;background:#fff;color:#000;border:none">▶️ Full YouTube Karaoke Kholu</button>`;

// Auto scroll to recorder
document.querySelector('.controls').scrollIntoView({behavior:'smooth'});
}

function playYoutubeKaraoke(query){
// Open YouTube Karaoke in mini player
let container=document.getElementById('lyrics');
container.innerHTML=`
<div style="font-weight:bold;margin-bottom:10px">🎬 Full Karaoke - ${query}</div>
<iframe width="100%" height="200" style="border-radius:15px" src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<div style="font-size:12px;opacity:.6;margin-top:8px">YouTube pe full track baj raha hai - Upar se apni voice record karo!</div>
`;
}

// Auto search on load - Trending
window.onload=()=>{document.getElementById('searchInput').value="Arijit Singh"; searchSongs();}
</script>
