*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a14;color:#fff;padding-bottom:90px;overflow-x:hidden}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#a259ff,#ff3eb8);padding:12px;border-radius:0 0 20px 20px}
.hTop{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:18px}
.liveBadge{background:#ffe600;color:#000;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:900}
.searchBar{margin-top:12px;background:#fff;border-radius:30px;padding:10px 16px;display:flex;gap:10px}
.searchBar input{border:0;outline:none;width:100%;color:#333}
.tabs{padding:12px;display:none;min-height:80vh}
.tabs.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:18px;overflow:hidden;position:relative;background:#1c1c2e;height:180px;cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 55%)}
