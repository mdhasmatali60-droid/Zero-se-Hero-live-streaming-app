<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO SE HERO - Movies LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff}
.header{background:#000;padding:12px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:100;justify-content:space-between}
.logo{color:#E50914;font-weight:900;font-size:18px}
.search{flex:1;display:flex;gap:6px;margin:0 10px}
.search input{flex:1;padding:10px 14px;border-radius:25px;border:none;background:#222;color:#fff}
.search button{padding:10px 16px;border-radius:25px;border:none;background:#E50914;color:#fff;font-weight:bold}
.hero{height:50vh;position:relative;background:#111}
.hero img{width:100%;height:100%;object-fit:cover}
.heroContent{position:absolute;bottom:20px;left:12px;right:12px}
.hero h1{font-size:22px;text-shadow:0 2px 10px #000}
.btn{padding:10px 18px;border-radius:6px;border:none;font-weight:bold;margin-right:8px}
.play{background:#fff;color:#000}.info{background:rgba(109,109,110,.7);color:#fff}
.row{padding:12px}
.row h3{margin:8px 0;font-size:16px}
.scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.scroll::-webkit-scrollbar{display:none}
.card{flex:0 0 140px;height:200px;border-radius:8px;overflow:hidden;position:relative;cursor:pointer;border:1px solid #222;background:#111}
.card img{width:100%;height:100%;object-fit:cover}
.card .title{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.9));padding:20px 6px;font-size:10px;font-weight:bold}
.badge{position:absolute;top:6px;left:6px;padding:3px 6px;border-radius:4px;font-size:9px;font-weight:bold}
.badge.new{background:#E50914}.badge.top{background:#f5c518;color:#000}
</style>
</head>
<body>
<div class="header">
<div class="logo">ZERO SE HERO</div>
<div class="search">
<input id="q" placeholder="Search: Pathaan, Avengers, Tere Bin...">
<button onclick="doSearch()">SEARCH</button>
</div>
<div style="font-size:12px;background:#00aa00;padding:4px 8px;border-radius:12px">LIVE TMDB</div>
</div>

<div class="hero" id="hero" onclick="playFromHero()">
<img id="heroImg" src="https://image.tmdb.org/t/p/w780/74xTEgt7R36Fpooo50r9T25onhq.jpg">
<div class="heroContent">
<h1 id="heroTitle">Loading Trending... Zero Se Hero LIVE</h1>
<p id="heroDesc" style="font-size:12px;opacity:.8;margin:6px 0">Powered by TMDB - Real Movies - Legal Trailers</p>
<div>
<button class="btn play" onclick="playFromHero()">▶️ Play Trailer</button>
<button class="btn info" onclick="doSearch()">ℹ️ More Info</button>
</div>
</div>
</div>

<div class="row"><h3>🔥 Trending Now - LIVE</h3><div class="scroll" id="trending"></div></div>
<div class="row"><h3>🇵🇰 Pakistan Dramas & Movies</h3><div class="scroll" id="pak"></div></div>
<div class="row"><h3>🇰🇷 Korean Dramas</h3><div class="scroll" id="korean"></div></div>
<div class="row"><h3>🇺🇸 Hollywood Hits</h3><div class="scroll" id="hollywood"></div></div>
<div class="row"><h3>🇮🇳 Bollywood</h3><div class="scroll" id="bolly"></div></div>

<div id="resultsRow" class="row" style="display:none"><h3 id="resTitle">Search Results</h3><div class="scroll" id="results" style="flex-wrap:wrap"></div></div>

<div id="playerBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999;flex-direction:column">
<div style="padding:12px;display:flex;justify-content:space-between;background:#111"><span id="pTitle">Trailer</span><button onclick="closeP()" style="background:#E50914;color:#fff;border:none;padding:8px 12px;border-radius:8px">✕ Close</button></div>
<iframe id="player" style="flex:1;width:100%;border:none" allowfullscreen></iframe>
</div>

<script>
const API_KEY="d0bf1edf9bce13874f519004464a9be2";
const IMG="https://image.tmdb.org/t/p/w300";
const IMG_HERO="https://image.tmdb.org/t/p/w780";
let heroData={title:"Zero Se Hero"};

async function fetchTMDB(url){
let r=await fetch(url);
return await r.json();
}

async function loadAll(){
let trend = await fetchTMDB(`https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}`);
showRow(trend.results, "trending", true);

let pak = await fetchTMDB(`https://api.themoviedb.org/3/search/tv?api_key=${API_KEY}&query=Tere Bin`);
showRow(pak.results, "pak");

let kor = await fetchTMDB(`https://api.themoviedb.org/3/search/tv?api_key=${API_KEY}&query=Crash Landing`);
showRow(kor.results, "korean");

let holly = await fetchTMDB(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=Avengers`);
showRow(holly.results, "hollywood");

let bolly = await fetchTMDB(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=Pathaan`);
showRow(bolly.results, "bolly");
}

function showRow(list, id, setHero=false){
let el=document.getElementById(id);
el.innerHTML="";
let count=0;
for(let m of list){
if(!m.poster_path) continue;
if(count==0 && setHero){
document.getElementById('heroImg').src = m.backdrop_path ? IMG_HERO+m.backdrop_path : IMG+m.poster_path;
document.getElementById('heroTitle').innerText = (m.title||m.name);
document.getElementById('heroDesc').innerText = (m.overview||"Trending on TMDB - Watch Trailer").slice(0,90)+"...";
heroData.title = m.title||m.name;
}
let title=(m.title||m.name||"").replace(/'/g,"");
el.innerHTML+=`<div class="card" onclick="playTrailer('${encodeURIComponent(title)}')">
${count<3?'<span class="badge new">TOP 10</span>':''}
<img src="${IMG+m.poster_path}" loading="lazy">
<div class="title">${title}</div>
</div>`;
count++;
if(count>12) break;
}
}

async function doSearch(){
let q=document.getElementById('q').value.trim();
if(!q){q="Avengers";}
let data = await fetchTMDB(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}`);
document.getElementById('resultsRow').style.display='block';
document.getElementById('resTitle').innerText=`Results for "${q}" - LIVE TMDB`;
let el=document.getElementById('results');
el.innerHTML="";
for(let m of data.results){
if(!m.poster_path) continue;
let title=(m.title||m.name||"").replace(/'/g,"");
el.innerHTML+=`<div class="card" onclick="playTrailer('${encodeURIComponent(title)}')"><img src="${IMG+m.poster_path}"><div class="title">${title}</div></div>`;
}
window.scrollTo(0,document.getElementById('resultsRow').offsetTop-60);
}

function playTrailer(qEnc){
let q=decodeURIComponent(qEnc);
let ytSearch=encodeURIComponent(q+" official trailer");
document.getElementById('playerBox').style.display='flex';
document.getElementById('pTitle').innerText=q+" - Trailer";
document.getElementById('player').src=`https://www.youtube.com/embed?listType=search&list=${ytSearch}`;
}
function playFromHero(){playTrailer(encodeURIComponent(heroData.title));}
function closeP(){document.getElementById('playerBox').style.display='none';document.getElementById('player').src='';}

loadAll();
</script>
</body>
</html>
