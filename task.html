<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tasks PRO</title>
<style>
body{margin:0;background:#0a001a;color:#fff;font-family:sans-serif;padding:12px;padding-bottom:90px}
.coinBar{background:linear-gradient(90deg,gold,orange);color:#000;padding:12px;border-radius:14px;text-align:center;font-weight:bold;display:flex;justify-content:space-around}
.task{background:#1a0033;border:1px solid #7000ff;border-radius:16px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.btn{padding:9px 18px;border:none;border-radius:20px;font-weight:bold}
.btn-go{background:gold;color:#000}.btn-done{background:#00ff88;color:#000}
.wheelWrap{text-align:center;background:#1a0033;border:2px solid gold;border-radius:20px;padding:15px;margin:15px 0}
.wheel{width:150px;height:150px;border-radius:50%;margin:10px auto;background:conic-gradient(gold 0deg 60deg,#ff006a 60deg 120deg,#7000ff 120deg 180deg,#00ff88 180deg 240deg,#ff9900 240deg 300deg,#0099ff 300deg 360deg);border:5px solid #fff;transition:transform 3s cubic-bezier(.17,.67,.12,.99)}
</style>
</head>
<body>
<h2 style="color:gold;text-align:center">🎯 DAILY TASKS PRO</h2>
<div class="coinBar"><span>💰 <span id="myCoins">0</span></span><span>🔥 <span id="streak">1</span> Days</span><span>🎡 <span id="spinCount">0</span> Spin</span></div>

<div class="task"><div><b>📅 Daily Login</b><br><small id="p1" style="color:gold">0/1</small></div><button class="btn btn-go" id="b1" onclick="completeTask(1,50)">Go</button></div>
<div class="task"><div><b>👁 Watch Live 10 Min</b><br><small id="p2" style="color:gold">0/10 min</small></div><button class="btn btn-go" id="b2" onclick="location.href='live.html?task=watch'">Watch</button></div>
<div class="task"><div><b>💬 5 Messages</b><br><small id="p3" style="color:gold">0/5</small></div><button class="btn btn-go" id="b3" onclick="location.href='index.html'">Chat</button></div>
<div class="task"><div><b>🔴 Go Live 5 Min</b><br><small id="p4" style="color:gold">0/5 min</small></div><button class="btn btn-go" id="b4" onclick="location.href='live.html'">Go Live</button></div>
<div class="task" style="border-color:gold"><div><b>💰 Recharge Bonus</b><br><small style="color:gold">500 Coins</small></div><button class="btn btn-go" onclick="location.href='recharge.html'">Recharge</button></div>

<div class="wheelWrap">
<h3 style="color:gold;margin:5px">🎡 Spin Wheel</h3>
<div class="wheel" id="wheel"></div>
<button class="btn btn-go" onclick="spinWheel()" style="padding:12px 30px;margin-top:10px">SPIN - <span id="sp">0</span> Left</button>
</div>

<div style="text-align:center"><button onclick="location.href='index.html'" style="padding:12px 30px;background:#333;color:#fff;border:none;border-radius:25px">← Back to Live</button></div>

<script>
let coins=parseInt(localStorage.getItem('zh_coins')||'0');
let tasks=JSON.parse(localStorage.getItem('zh_tasks')||'{"1":0,"2":0,"3":0,"4":0}');
let spins=parseInt(localStorage.getItem('zh_spins')||'0');
let streak=parseInt(localStorage.getItem('zh_streak')||'1');
let today=new Date().toDateString();
let last=localStorage.getItem('zh_date');
if(last!=today){if(last){streak++;if(streak%7==0){coins+=1000;alert('🎉 7 Day Bonus +1000 Coins!');}}localStorage.setItem('zh_date',today);localStorage.setItem('zh_streak',streak);tasks={"1":0,"2":0,"3":0,"4":0};localStorage.setItem('zh_tasks',JSON.stringify(tasks));}
function upd(){document.getElementById('myCoins').innerText=coins;document.getElementById('streak').innerText=streak;document.getElementById('spinCount').innerText=spins;document.getElementById('sp').innerText=spins;for(let i=1;i<=4;i++){let b=document.getElementById('b'+i);if(tasks[i]){b.innerText='✅ Done';b.className='btn btn-done';b.disabled=true;}}}upd();
if(tasks[1]==0)completeTask(1,50);
function completeTask(id,r){tasks[id]=1;coins+=r;spins++;localStorage.setItem('zh_tasks',JSON.stringify(tasks));localStorage.setItem('zh_coins',coins);localStorage.setItem('zh_spins',spins);alert('✅ +'+r+' Coins +1 Spin!');upd();}
function spinWheel(){if(spins<=0){alert('❌ No Spins! Task complete karo');return;}spins--;localStorage.setItem('zh_spins',spins);let w=document.getElementById('wheel');w.style.transform='rotate('+(Math.random()*3600+720)+'deg)';setTimeout(()=>{let pr=[10,50,100,200,500,1000];let p=pr[Math.floor(Math.random()*pr.length)];coins+=p;localStorage.setItem('zh_coins',coins);alert('🎉 Won: '+p+' Coins!');upd();},3200);}
let u=new URLSearchParams(location.search);if(u.get('liveDone')){if(tasks[4]==0)completeTask(4,200);}
</script>
</body>
</html>
